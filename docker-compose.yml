# Full test environment: docker compose up --build --exit-code-from tests
x-primary-check: &primary
  interval: 2s
  timeout: 10s
  retries: 60

services:
  mongo-rs:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo-rs:27017'}]}); quit(1) }"]

  mongo-rs8:
    image: mongo:8
    command: mongod --replSet rs8 --bind_ip_all --port 27017
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs8', members: [{_id: 0, host: 'mongo-rs8:27017'}]}); quit(1) }"]

  mongo-auth:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "-u", "root", "-p", "secret", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]

  # sharded cluster behind HAProxy (PROXY protocol) for loadBalanced=true
  cfg:
    image: mongo:7
    command: mongod --configsvr --replSet cfg --port 27019 --bind_ip_all
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'cfg', configsvr: true, members: [{_id: 0, host: 'cfg:27019'}]}); quit(1) }"]
  shard:
    image: mongo:7
    command: mongod --shardsvr --replSet sh --port 27018 --bind_ip_all
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'sh', members: [{_id: 0, host: 'shard:27018'}]}); quit(1) }"]
  mongos:
    image: mongo:7
    command: mongos --configdb cfg/cfg:27019 --bind_ip_all --port 27017 --setParameter loadBalancerPort=27016
    depends_on:
      cfg: { condition: service_healthy }
      shard: { condition: service_healthy }
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "--quiet", "--eval", "const s = db.adminCommand({listShards: 1}).shards || []; if (s.length) quit(0); sh.addShard('sh/shard:27018'); quit(1)"]
  lb:
    image: haproxy:2.9-alpine
    volumes: ["./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on:
      mongos: { condition: service_healthy }

  socks:
    image: serjs/go-socks5-proxy
    environment:
      PROXY_USER: pu
      PROXY_PASSWORD: pp

  # Kerberos: KDC + MongoDB Enterprise accepting GSSAPI
  kdc:
    build: { context: ./docker, dockerfile: kdc/Dockerfile }
    hostname: kdc
    volumes: ["krb-keytab:/keytab"]
  krb-mongo:
    build: { context: ./docker, dockerfile: krb-mongo/Dockerfile }
    hostname: krb-mongo
    depends_on: [kdc]
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: secret
      KRB5_KTNAME: /keytab/mongodb.keytab
    volumes:
      - krb-keytab:/keytab:ro
      - ./docker/krb5.conf:/etc/krb5.conf:ro
      - ./docker/krb-init.js:/docker-entrypoint-initdb.d/krb-init.js:ro
    entrypoint: ["sh", "-c", "while [ ! -f /keytab/ready ]; do sleep 1; done; exec python3 /usr/local/bin/docker-entrypoint.py mongod --setParameter authenticationMechanisms=GSSAPI,SCRAM-SHA-256"]
    healthcheck:
      <<: *primary
      test: ["CMD", "mongosh", "-u", "root", "-p", "secret", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]

  # mongocryptd for automatic encryption without crypt_shared
  mongocryptd:
    image: mongodb/mongodb-enterprise-server:8.0-ubuntu2204
    # mongocryptd only listens on localhost: the tests container shares its network namespace
    entrypoint: ["mongocryptd", "--port", "27020", "--idleShutdownTimeoutSecs", "0", "--pidfilepath", "/tmp/mongocryptd.pid"]

  tests:
    build: .
    network_mode: "service:mongocryptd"
    depends_on:
      mongo-rs: { condition: service_healthy }
      mongo-rs8: { condition: service_healthy }
      mongo-auth: { condition: service_healthy }
      lb: { condition: service_started }
      socks: { condition: service_started }
      krb-mongo: { condition: service_healthy }
      mongocryptd: { condition: service_started }
    volumes:
      - ./docker/krb5.conf:/etc/krb5.conf:ro
    environment:
      SWM_GSSAPI_URI: mongodb://swmuser%40EXAMPLE.COM:swmpass@krb-mongo:27017/?authMechanism=GSSAPI
      SWM_GSSAPI_KINIT: swmuser@EXAMPLE.COM:swmpass
      SWM_CRYPT_SHARED: /opt/crypt/mongo_crypt_v1.so
      SWM_MONGOCRYPTD_URI: mongodb://127.0.0.1:27020
      SWM_RS_URI: mongodb://mongo-rs:27017/?replicaSet=rs0
      SWM_AUTH_URI: mongodb://root:secret@mongo-auth:27017/?authSource=admin
      SWM_RS8_URI: mongodb://mongo-rs8:27017/?replicaSet=rs8
      SWM_LB_URI: mongodb://lb:27200/?loadBalanced=true
      SWM_SOCKS_URI: mongodb://mongo-rs:27017/?directConnection=true&proxyHost=socks&proxyPort=1080&proxyUsername=pu&proxyPassword=pp
    command: >
      sh -c "php -v | head -1 && uname -m &&
             php testsuite/run.php &&
             php testsuite/features.php &&
             php testsuite/leak.php &&
             php testsuite/compression.php &&
             php testsuite/security.php"

volumes:
  krb-keytab:
